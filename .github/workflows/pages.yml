name: Deploy Pages

# Only main pushes deploy. Pages identifies a deployment by its commit SHA and will not redeploy a SHA it has
# already deployed, and a release tag points at a commit main already deployed, so a tag push could not update
# the site. A release is published by pushing the tag together with a new (empty) commit on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags and origin/main are needed to build every version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Test
        run: npm ci && npm test
      - name: Build site
        run: .github/build-site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
