<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B42AE">
<!-- Rewritten by .github/build-site.sh at deploy time: release tag (e.g. v0.0.1), "next", or "dev" when opened locally -->
<meta name="app-version" content="dev">
<title>読譜ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Music&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><i>𝄞</i><span>読譜ドリル</span></div>
    <div class="tabs" role="tablist">
      <button id="tabPractice" role="tab" aria-selected="true">練習</button>
      <button id="tabTimed" role="tab" aria-selected="false">60秒</button>
      <button id="tabRhythm" role="tab" aria-selected="false">リズム</button>
    </div>
    <button class="ghost" id="btnStats">記録</button>
    <button class="ghost" id="btnSettings">設定</button>
  </header>

  <section class="hud" aria-live="polite">
    <div class="stat"><span>正解</span><b id="hCorrect">0</b></div>
    <div class="stat"><span>連続</span><b id="hStreak">0</b></div>
    <div class="stat"><span>正答率</span><b id="hAcc">–</b></div>
    <div class="stat"><span id="hTimeLabel">平均</span><b id="hTime">–</b></div>
  </section>

  <main class="stage">
    <svg id="staff" viewBox="0 0 260 150" aria-label="五線譜"></svg>
    <div class="score" id="score" aria-label="五線譜" hidden></div>
    <div class="midi" id="midiBadge" hidden></div>
    <div class="devtag" id="verBadge" hidden></div>
    <div class="fb" id="fb"></div>
    <button class="primary submit" id="submit" hidden>決定</button>
    <div class="rctl" id="rctl" hidden>
      <div class="bpm"><button class="ghost" id="bpmDown" aria-label="遅く">−</button><span><b id="bpmVal">80</b><small>BPM</small></span><button class="ghost" id="bpmUp" aria-label="速く">＋</button></div>
      <div class="btns"><button class="primary" id="rGo">スタート</button><button class="ghost" id="rNext">次へ</button></div>
    </div>
    <div class="panel" id="panel" hidden></div>
  </main>

  <div class="kbwrap" id="kbwrap"><div class="kb" id="kb"></div></div>
</div>

<div class="scrim" id="scrimSettings" hidden>
  <div class="sheet" role="dialog" aria-label="設定">
    <div class="sheet-h"><h2>設定</h2><button class="ghost" data-close>閉じる</button></div>
    <div id="settingsBody"></div>
  </div>
</div>

<div class="scrim" id="scrimStats" hidden>
  <div class="sheet" role="dialog" aria-label="記録">
    <div class="sheet-h"><h2>記録</h2><button class="ghost" data-close>閉じる</button></div>
    <div id="statsBody"></div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
