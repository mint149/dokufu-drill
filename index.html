<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B42AE">
<title>読譜ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Music&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Base reset (formerly supplied by the Artifact host) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one-screen phone app — score panel on top, staff in the middle, piano keys at the bottom within thumb reach */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#141824; --muted:#5C6375; --line:#D2D7E1;
  --accent:#2B42AE; --accent-soft:#E2E6F8; --on-accent:#FFFFFF;
  --ok:#1D8550; --ng:#C2372D;
  --key-w:#FFFFFF; --key-edge:#BFC5D2; --key-b:#1A1D26; --key-label:#6A7183;
  --key-ok:#BFE6CF; --key-ng:#F4C7C2; --key-hint:#C9D2FA; --key-hint-edge:#2B42AE;
  --scrim:rgba(12,14,20,.45);
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-music:"Noto Music","Noto Sans Symbols 2","Segoe UI Symbol",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1117; --surface:#171B24; --ink:#E5E8EF; --muted:#959CAD; --line:#2A303E;
  --accent:#93A4FF; --accent-soft:#222A47; --on-accent:#0E1117;
  --ok:#4CC38A; --ng:#FF7D72;
  --key-w:#E3E6ED; --key-edge:#7E8596; --key-b:#06070A; --key-label:#4E5567;
  --key-ok:#9ADBB8; --key-ng:#F2ADA6; --key-hint:#AEBBF4; --key-hint-edge:#93A4FF;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1117; --surface:#171B24; --ink:#E5E8EF; --muted:#959CAD; --line:#2A303E;
  --accent:#93A4FF; --accent-soft:#222A47; --on-accent:#0E1117;
  --ok:#4CC38A; --ng:#FF7D72;
  --key-w:#E3E6ED; --key-edge:#7E8596; --key-b:#06070A; --key-label:#4E5567;
  --key-ok:#9ADBB8; --key-ng:#F2ADA6; --key-hint:#AEBBF4; --key-hint-edge:#93A4FF;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;box-sizing:border-box;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}

.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{margin-right:auto;font-weight:700;font-size:16px;letter-spacing:.06em;display:flex;align-items:baseline;gap:6px}
.brand i{font-style:normal;font-family:var(--f-music);color:var(--accent);font-size:20px;line-height:1}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}

.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{display:flex;flex-direction:column;gap:1px;padding:0 2px}
.stat span{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.stat b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat b small{font-size:12px;font-weight:500;color:var(--muted);margin-left:1px}

.stage{flex:1 1 auto;min-height:0;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  display:flex;flex-direction:column;align-items:center;padding:6px 8px 8px}
#staff{flex:1 1 auto;min-height:0;width:100%;color:var(--ink)}
#staff .sl{stroke:var(--ink);stroke-width:1;opacity:.75}
#staff .ledger{stroke:var(--ink);stroke-width:1.3}
#staff .bar{stroke:var(--ink);stroke-width:1.2;opacity:.75}
#staff .brace{stroke:var(--ink);stroke-width:3;opacity:.75}
#staff .glyph{fill:var(--ink);font-family:var(--f-music)}
#staff .note{fill:var(--ink);stroke:none}
#staff .note.ng,#staff .glyph.ng{fill:var(--ng)}
#staff .stem{stroke:var(--ink);stroke-width:1.4}
#staff .stem.ng{stroke:var(--ng)}
#staff .enter{animation:enter .14s ease-out}
@keyframes enter{from{transform:translateX(6px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){#staff .enter{animation:none}}
.midi{position:absolute;top:6px;left:10px;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);max-width:45%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.midi::before{content:"";flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.midi-st{font-size:13px;color:var(--muted)}
.fb{min-height:1.5em;font-size:15px;font-weight:500;text-align:center;text-wrap:balance}
.fb.ok{color:var(--ok)} .fb.ng{color:var(--ng)}

.panel{position:absolute;inset:0;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;z-index:3}
.panel .inner{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:340px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);margin:0}
.big{font-size:52px;font-weight:700;margin:0;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:16px;font-weight:500;margin-left:4px;color:var(--muted)}
.panel h2{font-size:20px;margin:0;text-wrap:balance}
.combo{font-size:12px;color:var(--muted);margin:0}
.res-grid{display:grid;grid-template-columns:repeat(3,auto);gap:4px 18px;margin:4px 0}
.res-grid span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.res-grid b{font-size:16px;font-variant-numeric:tabular-nums}
.badge{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:999px}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.primary{border:0;background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:999px;padding:10px 22px;font-size:15px}

.kbwrap{flex:0 0 auto;height:clamp(140px,31vh,230px);overflow-x:auto;overflow-y:hidden;border-radius:4px 4px 10px 10px;
  overscroll-behavior-x:contain;scrollbar-width:thin}
.kb{position:relative;display:flex;height:100%;width:100%;box-sizing:border-box;border-top:3px solid var(--key-b)}
.key{border:0;padding:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.key.w{flex:1 1 0;min-width:0;background:var(--key-w);border-right:1px solid var(--key-edge);border-radius:0 0 7px 7px;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:12px;font-weight:500;color:var(--key-label);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.06)}
.key.w:first-child{border-left:1px solid var(--key-edge)}
.key.b{position:absolute;top:0;height:60%;background:var(--key-b);border-radius:0 0 5px 5px;z-index:2;
  box-shadow:inset 0 -5px 0 rgba(255,255,255,.08)}
.key.w.down{background:var(--key-hint)}
.key.b.down{background:var(--key-hint-edge)}
.key.ok{background:var(--key-ok)!important}
.key.ng{background:var(--key-ng)!important}
.key.hint{background:var(--key-hint)!important;outline:3px solid var(--key-hint-edge);outline-offset:-3px}
.key.b.ok,.key.b.ng,.key.b.hint{z-index:3}

.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:min(560px,100%);max-height:86%;overflow:auto;border-radius:16px 16px 0 0;box-sizing:border-box;
  padding-top:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sheet-h h2{font-size:17px;margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row label{font-size:14px;font-weight:500}
.row .help{flex-basis:100%;font-size:12px;color:var(--muted);margin:-4px 0 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.sec-t{font-size:12px;letter-spacing:.1em;color:var(--muted);margin:16px 0 6px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.weak{width:100%;border-collapse:collapse;font-size:14px}
.weak td{padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.weak td:last-child{text-align:right;color:var(--muted)}
.bar-mini{display:inline-block;height:6px;border-radius:3px;background:var(--ng);vertical-align:middle;margin-right:8px;opacity:.8}
.empty{font-size:13px;color:var(--muted);margin:6px 0}
.danger{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;margin-top:14px}
.danger.armed{border-color:var(--ng);color:var(--ng);font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><i>𝄞</i>読譜ドリル</div>
    <div class="tabs" role="tablist">
      <button id="tabPractice" role="tab" aria-selected="true">練習</button>
      <button id="tabTimed" role="tab" aria-selected="false">60秒</button>
    </div>
    <button class="ghost" id="btnStats">記録</button>
    <button class="ghost" id="btnSettings">設定</button>
  </header>

  <section class="hud" aria-live="polite">
    <div class="stat"><span>正解</span><b id="hCorrect">0</b></div>
    <div class="stat"><span>連続</span><b id="hStreak">0</b></div>
    <div class="stat"><span>正答率</span><b id="hAcc">–</b></div>
    <div class="stat"><span id="hTimeLabel">平均</span><b id="hTime">–</b></div>
  </section>

  <main class="stage">
    <svg id="staff" viewBox="0 0 260 150" aria-label="五線譜"></svg>
    <div class="midi" id="midiBadge" hidden></div>
    <div class="fb" id="fb"></div>
    <div class="panel" id="panel" hidden></div>
  </main>

  <div class="kbwrap" id="kbwrap"><div class="kb" id="kb"></div></div>
</div>

<div class="scrim" id="scrimSettings" hidden>
  <div class="sheet" role="dialog" aria-label="設定">
    <div class="sheet-h"><h2>設定</h2><button class="ghost" data-close>閉じる</button></div>
    <div id="settingsBody"></div>
  </div>
</div>

<div class="scrim" id="scrimStats" hidden>
  <div class="sheet" role="dialog" aria-label="記録">
    <div class="sheet-h"><h2>記録</h2><button class="ghost" data-close>閉じる</button></div>
    <div id="statsBody"></div>
  </div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const LETTERS=['C','D','E','F','G','A','B'];
const DOREMI=['ド','レ','ミ','ファ','ソ','ラ','シ'];
const PC=[0,2,4,5,7,9,11];
const BOT={T:30,B:18}; // diatonic index of bottom line: E4 / G2
const LS='dokufu.v1';

let store={settings:{},notes:{},best:{}};
try{const r=localStorage.getItem(LS);if(r){const p=JSON.parse(r);store=Object.assign(store,p);}}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(store));}catch(e){}}

const DEF={clef:'T',ledger:2,acc:0,octave:0,labels:'C',names:'jp',weak:1,sound:1,vibe:1,midi:0};
const S=Object.assign({},DEF,store.settings||{});
const STRUCT=['clef','ledger','acc','octave'];

let pool=[],cur=null,lastId=null,shownAt=0,locked=false;
let mode='practice',running=false,endAt=0,timer=null;
let ses;
function resetSession(){ses={shown:0,first:0,streak:0,best:0,rts:[]};}
resetSession();

/* ---------- notes ---------- */
const octOf=d=>Math.floor(d/7);
const midi=n=>12*(octOf(n.d)+1)+PC[n.d%7]+n.acc;
const isWhite=m=>PC.includes(((m%12)+12)%12);
function nm(n,withOct){
  const L=n.d%7;let s=S.names==='jp'?DOREMI[L]:LETTERS[L];
  if(n.acc===1)s+='♯';if(n.acc===-1)s+='♭';
  if(withOct)s+=octOf(n.d);
  return s;
}
function buildPool(){
  const staves=S.clef==='G'?['T','B']:[S.clef];
  pool=[];
  for(const st of staves){
    const b=BOT[st],lo=b-2*S.ledger-1,hi=b+8+2*S.ledger+1;
    for(let d=lo;d<=hi;d++){
      const L=d%7;
      pool.push({st,d,acc:0});
      if(S.acc){
        if([0,1,3,4,5].includes(L))pool.push({st,d,acc:1});
        if([1,2,4,5,6].includes(L))pool.push({st,d,acc:-1});
      }
    }
  }
  pool.forEach(n=>n.id=n.st+':'+n.d+':'+n.acc);
}
function weight(n){
  if(!S.weak)return 1;
  const r=store.notes[n.id];
  if(!r)return 2;
  return 1+8*r.m/(r.s+1)+(r.s<3?1:0);
}
function pick(){
  const c=pool.filter(n=>n.id!==lastId);
  const ws=c.map(weight);let x=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<c.length;i++){x-=ws[i];if(x<=0)return Object.assign({},c[i]);}
  return Object.assign({},c[c.length-1]);
}

/* ---------- glyph measurement (ink bounds via canvas) ---------- */
let gcache={};const cv=document.createElement('canvas').getContext('2d');
function gm(ch){
  if(gcache[ch])return gcache[ch];
  cv.font='100px "Noto Music","Noto Sans Symbols 2",serif';
  const t=cv.measureText(ch);
  return gcache[ch]={l:t.actualBoundingBoxLeft||0,r:t.actualBoundingBoxRight||0,a:t.actualBoundingBoxAscent||0,d:t.actualBoundingBoxDescent||0};
}
function glyph(ch,top,h,opts){
  const m=gm(ch),tot=m.a+m.d;if(!tot)return '';
  const F=h*100/tot,w=(m.l+m.r)*F/100;
  const left=opts.right!=null?opts.right-w:opts.left;
  const x=left+m.l*F/100,y=top+m.a*F/100;
  return `<text class="glyph${opts.cls?' '+opts.cls:''}" x="${x.toFixed(2)}" y="${y.toFixed(2)}" font-size="${F.toFixed(2)}">${ch}</text>`;
}

/* ---------- staff ---------- */
function layout(){
  if(S.clef==='G')return{H:244,tops:{T:62,B:150}};
  return{H:150,tops:{[S.clef]:55}};
}
function draw(){
  const L=layout(),svg=$('staff');
  svg.setAttribute('viewBox',`0 0 260 ${L.H}`);
  const x0=14,x1=248;let s='';
  for(const st in L.tops){
    const top=L.tops[st];
    for(let i=0;i<5;i++){const y=top+i*10;s+=`<line class="sl" x1="${x0}" y1="${y}" x2="${x1}" y2="${y}"/>`;}
    s+=`<line class="bar" x1="${x1}" y1="${top}" x2="${x1}" y2="${top+40}"/>`;
    s+=st==='T'?glyph('𝄞',top-15,70,{left:20}):glyph('𝄢',top-0.5,31,{left:20});
  }
  if(S.clef==='G'){
    s+=`<line class="bar" x1="${x0}" y1="${L.tops.T}" x2="${x0}" y2="${L.tops.B+40}"/>`;
    s+=`<line class="brace" x1="${x0-6}" y1="${L.tops.T}" x2="${x0-6}" y2="${L.tops.B+40}"/>`;
  }else{
    const t=L.tops[S.clef];s+=`<line class="bar" x1="${x0}" y1="${t}" x2="${x0}" y2="${t+40}"/>`;
  }
  if(cur){
    const top=L.tops[cur.st],b=BOT[cur.st],bl=top+40;
    const yOf=d=>bl-(d-b)*5;const y=yOf(cur.d),nx=160;
    const c=cur.missed?' ng':'';
    let g='';
    if(cur.d<=b-2)for(let ld=b-2;ld>=cur.d;ld-=2)g+=`<line class="ledger" x1="${nx-12}" y1="${yOf(ld)}" x2="${nx+12}" y2="${yOf(ld)}"/>`;
    if(cur.d>=b+10)for(let ld=b+10;ld<=cur.d;ld+=2)g+=`<line class="ledger" x1="${nx-12}" y1="${yOf(ld)}" x2="${nx+12}" y2="${yOf(ld)}"/>`;
    if(cur.d>=b+4)g+=`<line class="stem${c}" x1="${nx-5.4}" y1="${y+1}" x2="${nx-5.4}" y2="${y+34}"/>`;
    else g+=`<line class="stem${c}" x1="${nx+5.4}" y1="${y-1}" x2="${nx+5.4}" y2="${y-34}"/>`;
    g+=`<ellipse class="note${c}" cx="${nx}" cy="${y}" rx="6.3" ry="4.4" transform="rotate(-20 ${nx} ${y})"/>`;
    if(cur.acc===1)g+=glyph('♯',y-14,28,{right:nx-11,cls:c.trim()});
    if(cur.acc===-1)g+=glyph('♭',y-19,25,{right:nx-11,cls:c.trim()});
    s+=`<g class="${cur.fresh?'enter':''}">${g}</g>`;
    cur.fresh=false;
  }
  svg.innerHTML=s;
}

/* ---------- keyboard ---------- */
let kbLo=60,kbHi=71;
function buildKb(){
  const kb=$('kb');kb.innerHTML='';
  if(!S.octave){kbLo=60;kbHi=71;}
  else{
    const ms=pool.map(midi);
    kbLo=12*Math.floor(Math.min(...ms)/12);kbHi=12*Math.floor(Math.max(...ms)/12)+11;
  }
  const whites=[];for(let m=kbLo;m<=kbHi;m++)if(isWhite(m))whites.push(m);
  const n=whites.length;
  kb.style.minWidth=S.octave?(n*36)+'px':'';
  whites.forEach(m=>{
    const b=document.createElement('button');b.className='key w';b.dataset.midi=m;
    const L=PC.indexOf(m%12),name=S.names==='jp'?DOREMI[L]:LETTERS[L];
    let lab='';
    if(S.labels==='A')lab=name+(S.octave&&L===0?(m/12-1):'');
    else if(S.labels==='C'&&L===0)lab=name+(S.octave?(m/12-1):'');
    b.textContent=lab;b.setAttribute('aria-label',name+(Math.floor(m/12)-1));
    kb.appendChild(b);
  });
  whites.forEach((m,i)=>{
    if(m+1<=kbHi&&!isWhite(m+1)){
      const b=document.createElement('button');b.className='key b';b.dataset.midi=m+1;
      b.style.left=`calc(${(i+1)/n*100}% - ${0.31/n*100}%)`;b.style.width=`${0.62/n*100}%`;
      b.setAttribute('aria-label','黒鍵');
      kb.appendChild(b);
    }
  });
  const w=$('kbwrap');
  requestAnimationFrame(()=>{w.scrollLeft=(w.scrollWidth-w.clientWidth)/2;});
}
function clearKeys(){document.querySelectorAll('.key.ok,.key.ng,.key.hint').forEach(k=>k.classList.remove('ok','ng','hint'));}
function flash(el,cls,ms){el.classList.add(cls);if(ms)setTimeout(()=>el.classList.remove(cls),ms);}

/* ---------- audio ---------- */
let ac=null;
function unlock(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}}
  if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});
}
function play(m){
  if(!ac)return;
  const f=440*Math.pow(2,(m-69)/12),t=ac.currentTime;
  const out=ac.createGain();out.gain.setValueAtTime(0.0001,t);
  out.gain.exponentialRampToValueAtTime(0.3,t+0.008);out.gain.exponentialRampToValueAtTime(0.0001,t+1.5);
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(9000,f*7);
  [['triangle',1,1],['sine',2,0.32],['sine',3,0.1]].forEach(([ty,mul,amp])=>{
    const o=ac.createOscillator(),og=ac.createGain();o.type=ty;o.frequency.value=f*mul;og.gain.value=amp;
    o.connect(og);og.connect(lp);o.start(t);o.stop(t+1.6);
  });
  lp.connect(out);out.connect(ac.destination);
}
function vibe(){if(S.vibe&&navigator.vibrate){try{navigator.vibrate(60);}catch(e){}}}

/* ---------- flow ---------- */
function setFb(t,cls){const f=$('fb');f.textContent=t;f.className='fb'+(cls?' '+cls:'');}
function next(){
  clearKeys();cur=pick();cur.missed=false;cur.fresh=true;lastId=cur.id;
  shownAt=performance.now();locked=false;draw();setFb('');
}
function record(missed){
  const r=store.notes[cur.id]||(store.notes[cur.id]={s:0,m:0});
  r.s++;if(missed)r.m++;save();
}
function onKey(el){
  const m=+el.dataset.midi;
  unlock();if(S.sound)play(m);
  judge(m,el);
}
/* m: MIDI note number. el: on-screen key to color (may be null for MIDI input outside the keyboard range). */
function judge(m,el){
  if(locked||!cur)return;
  if(mode==='timed'&&!running)return;
  const t=midi(cur);
  const ok=S.octave?m===t:((m-t)%12+12)%12===0;
  if(ok){
    if(el)flash(el,'ok');ses.shown++;
    if(!cur.missed){ses.first++;ses.streak++;ses.best=Math.max(ses.best,ses.streak);ses.rts.push(performance.now()-shownAt);}
    record(cur.missed);
    setFb(nm(cur,true)+'  ✓','ok');locked=true;hud();
    setTimeout(()=>{if(mode==='timed'&&!running)return;next();},cur.missed?260:190);
  }else{
    if(el)flash(el,'ng',320);vibe();
    if(!cur.missed){cur.missed=true;ses.streak=0;draw();}
    let h=null;
    document.querySelectorAll('.key').forEach(k=>{
      const km=+k.dataset.midi;
      if(S.octave?km===t:((km-t)%12+12)%12===0)h=k;
    });
    if(h){h.classList.add('hint');if(S.octave)h.scrollIntoView({inline:'nearest',block:'nearest'});}
    setFb('正解は '+nm(cur,true)+'　光っている鍵盤で次へ','ng');hud();
  }
}
/* Tap = press and release without moving. A drag (scroll) cancels the press. */
let press=null;
function endPress(){if(press){press.k.classList.remove('down');press=null;}}
$('kb').addEventListener('pointerdown',e=>{
  const k=e.target.closest('.key');if(!k)return;
  if(e.pointerType==='mouse')e.preventDefault();
  endPress();
  press={k,id:e.pointerId,x:e.clientX,y:e.clientY,sl:$('kbwrap').scrollLeft};
  k.classList.add('down');
});
$('kb').addEventListener('pointermove',e=>{
  if(!press||e.pointerId!==press.id)return;
  if(Math.abs(e.clientX-press.x)>10||Math.abs(e.clientY-press.y)>10)endPress();
});
$('kb').addEventListener('pointerup',e=>{
  if(!press||e.pointerId!==press.id)return;
  const k=press.k,moved=Math.abs($('kbwrap').scrollLeft-press.sl)>3;
  endPress();
  if(!moved)onKey(k);
});
$('kb').addEventListener('pointercancel',endPress);
$('kbwrap').addEventListener('scroll',()=>{if(press&&Math.abs($('kbwrap').scrollLeft-press.sl)>3)endPress();},{passive:true});
$('kb').addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('key')){e.preventDefault();onKey(e.target);}
});

function avg(){return ses.rts.length?ses.rts.reduce((a,b)=>a+b,0)/ses.rts.length/1000:null;}
function hud(){
  $('hCorrect').textContent=ses.first;
  $('hStreak').textContent=ses.streak;
  $('hAcc').innerHTML=ses.shown?Math.round(ses.first/ses.shown*100)+'<small>%</small>':'–';
  if(mode==='timed'){
    $('hTimeLabel').textContent='残り';
    const left=running?Math.max(0,(endAt-performance.now())/1000):(ses.shown?0:60);
    $('hTime').innerHTML=left.toFixed(1)+'<small>秒</small>';
  }else{
    $('hTimeLabel').textContent='平均';
    const a=avg();$('hTime').innerHTML=a==null?'–':a.toFixed(2)+'<small>秒</small>';
  }
}

/* ---------- modes ---------- */
const CLEFN={T:'ト音記号',B:'ヘ音記号',G:'大譜表'};
const comboKey=()=>`${S.clef}-${S.ledger}-${S.acc}-${S.octave}`;
const comboText=()=>`${CLEFN[S.clef]}・加線${S.ledger?S.ledger+'本まで':'なし'}・♯♭${S.acc?'あり':'なし'}・${S.octave?'高さまで判定':'音名だけ判定'}`;
function showPanel(html){const p=$('panel');p.innerHTML='<div class="inner">'+html+'</div>';p.hidden=false;}
function hidePanel(){$('panel').hidden=true;}
function showStart(){
  const b=store.best[comboKey()];
  showPanel(`<p class="eyebrow">60秒チャレンジ</p><h2>60秒で何音読めるか</h2><p class="combo">${comboText()}</p>
    ${b!=null?`<span class="badge">自己ベスト ${b}音</span>`:''}
    <div class="btns"><button class="primary" id="goTimed">スタート</button></div>`);
  $('goTimed').addEventListener('click',startTimed);
}
function startTimed(){
  unlock();hidePanel();resetSession();running=true;endAt=performance.now()+60000;next();hud();
  clearInterval(timer);
  timer=setInterval(()=>{if(performance.now()>=endAt)finishTimed();else hud();},100);
}
function finishTimed(){
  clearInterval(timer);running=false;cur=null;clearKeys();draw();setFb('');hud();
  const k=comboKey(),prev=store.best[k];let isNew=false;
  if(prev==null||ses.first>prev){store.best[k]=ses.first;save();isNew=prev!=null||ses.first>0;}
  const a=avg();
  showPanel(`<p class="eyebrow">結果</p><p class="big">${ses.first}<small>音</small></p>
    ${isNew?'<span class="badge">自己ベスト更新</span>':''}
    <div class="res-grid"><span>正答率</span><span>平均</span><span>ベスト</span>
    <b>${ses.shown?Math.round(ses.first/ses.shown*100):0}%</b><b>${a==null?'–':a.toFixed(2)+'秒'}</b><b>${store.best[k]}音</b></div>
    <p class="combo">${comboText()}</p>
    <div class="btns"><button class="primary" id="again">もう一度</button><button class="ghost" id="toPractice">練習に戻る</button></div>`);
  $('again').addEventListener('click',startTimed);
  $('toPractice').addEventListener('click',()=>setMode('practice'));
}
function setMode(m){
  mode=m;clearInterval(timer);running=false;resetSession();
  $('tabPractice').setAttribute('aria-selected',m==='practice');
  $('tabTimed').setAttribute('aria-selected',m==='timed');
  if(m==='timed'){cur=null;clearKeys();draw();setFb('');showStart();}
  else{hidePanel();next();}
  hud();
}
$('tabPractice').addEventListener('click',()=>setMode('practice'));
$('tabTimed').addEventListener('click',()=>setMode('timed'));

/* ---------- settings sheet ---------- */
function defs(){return[
  {k:'clef',label:'音部記号',opts:[['T','ト音'],['B','ヘ音'],['G','大譜表']]},
  {k:'ledger',label:'加線',opts:[[0,'なし'],[1,'1本'],[2,'2本'],[3,'3本']],help:'五線の外に出る音を何本目の加線まで出すか'},
  {k:'acc',label:'♯・♭',opts:[[0,'なし'],[1,'あり']]},
  {k:'octave',label:'判定',opts:[[0,'音名だけ'],[1,'高さまで']],help:'「高さまで」は鍵盤が数オクターブに広がり、横にスクロールして弾きます'},
  {k:'labels',label:'鍵盤の文字',opts:[['N','なし'],['C',S.names==='jp'?'ドだけ':'Cだけ'],['A','すべて']]},
  {k:'names',label:'音名',opts:[['jp','ドレミ'],['en','CDE']]},
  {k:'weak',label:'苦手な音を多めに出す',opts:[[1,'オン'],[0,'オフ']]},
  {k:'sound',label:'鍵盤の音',opts:[[1,'オン'],[0,'オフ']]},
  {k:'vibe',label:'ミスで振動',opts:[[1,'オン'],[0,'オフ']],help:'対応していない端末では振動しません'}
];}
function renderSettings(){
  $('settingsBody').innerHTML=defs().map(d=>`<div class="row"><label>${d.label}</label><div class="seg">${
    d.opts.map(([v,t])=>`<button data-k="${d.k}" data-v="${v}" aria-pressed="${String(S[d.k])===String(v)}">${t}</button>`).join('')
  }</div>${d.help?`<p class="help">${d.help}</p>`:''}</div>`).join('')+
  `<div class="row" id="midiRow"><label>電子ピアノ（MIDI）</label><button class="ghost" data-midi-toggle></button>
   <p class="help midi-st"></p>
   <p class="help">USB ケーブルで電子ピアノをつなぐと、弾いた鍵盤で答えられます（スマホは OTG アダプタが必要）。</p></div>`;
  updMidi();
}
$('settingsBody').addEventListener('click',e=>{
  if(e.target.closest('[data-midi-toggle]')){setMidi(!S.midi);return;}
  const b=e.target.closest('button[data-k]');if(!b)return;
  const k=b.dataset.k,raw=b.dataset.v,v=/^\d+$/.test(raw)?+raw:raw;
  if(S[k]===v)return;
  S[k]=v;store.settings=Object.assign({},S);save();
  if(STRUCT.includes(k)){buildPool();lastId=null;buildKb();setMode(mode);}
  else if(k==='labels'||k==='names'){buildKb();if(cur&&k==='names'&&$('fb').textContent)setFb('');}
  renderSettings();
});

/* ---------- MIDI input (electronic piano) ---------- */
let midiAcc=null,midiErr='';const held=new Map();
const midiOk=()=>!!navigator.requestMIDIAccess&&window.isSecureContext;
const midiInputs=()=>midiAcc?[...midiAcc.inputs.values()].filter(i=>i.state==='connected'):[];
function keyFor(m){
  // Non-octave mode: any octave on the piano maps to the same pitch class on the on-screen keyboard.
  const t=S.octave?m:kbLo+((m-kbLo)%12+12)%12;
  return document.querySelector(`.key[data-midi="${t}"]`);
}
function onMidi(e){
  if(!e.data||e.data.length<3)return;
  const[st,n,v]=e.data,type=st&0xF0;
  if(type===0x90&&v>0){
    const el=keyFor(n);if(el)el.classList.add('down');held.set(n,el);
    judge(n,el);
  }else if(type===0x80||type===0x90){
    const el=held.get(n);if(el)el.classList.remove('down');held.delete(n);
  }
}
function bindMidi(){
  if(midiAcc)midiAcc.inputs.forEach(i=>{i.onmidimessage=S.midi?onMidi:null;});
  updMidi();
}
async function connectMidi(){
  midiErr='';
  if(!midiOk()){midiErr='このブラウザは Web MIDI に対応していません（Android の Chrome などで開いてください）';updMidi();return;}
  try{
    midiAcc=await navigator.requestMIDIAccess();
    midiAcc.onstatechange=bindMidi;
  }catch(e){midiAcc=null;midiErr='MIDI の利用が許可されませんでした。ブラウザのサイト設定で許可してください';}
  bindMidi();
}
function setMidi(on){
  S.midi=on?1:0;store.settings=Object.assign({},S);save();
  if(on)connectMidi();else{held.forEach(el=>el&&el.classList.remove('down'));held.clear();midiErr='';bindMidi();}
}
function updMidi(){
  const ins=S.midi?midiInputs():[],bd=$('midiBadge');
  bd.hidden=!ins.length;bd.textContent=ins.map(i=>i.name).join('、');
  const row=$('midiRow');if(!row)return;
  let st;
  if(!S.midi)st='オフ';
  else if(midiErr)st=midiErr;
  else if(!midiAcc)st='接続中…';
  else st=ins.length?'接続中：'+ins.map(i=>i.name).join('、'):'電子ピアノが見つかりません。ケーブルと電源を確認してください';
  row.querySelector('.midi-st').textContent=st;
  row.querySelector('button').textContent=S.midi?'オフにする':'接続する';
}

/* ---------- stats sheet ---------- */
let armed=false;
function renderStats(){
  const a=avg();
  const rows=Object.entries(store.notes).filter(([,r])=>r.s>=3&&r.m>0)
    .map(([id,r])=>{const[st,d,acc]=id.split(':');return{st,n:{d:+d,acc:+acc},r,rate:r.m/r.s};})
    .sort((x,y)=>y.rate-x.rate||y.r.m-x.r.m).slice(0,8);
  const bests=Object.entries(store.best).sort((x,y)=>y[1]-x[1]);
  const bestTxt=k=>{const[c,l,ac,o]=k.split('-');return`${CLEFN[c]}・加線${+l?l+'本':'なし'}・♯♭${+ac?'あり':'なし'}・${+o?'高さ':'音名'}`;};
  $('statsBody').innerHTML=`
    <p class="sec-t">このセッション</p>
    <div class="kv">
      <div class="stat"><span>出題</span><b>${ses.shown}</b></div>
      <div class="stat"><span>一発正解</span><b>${ses.first}</b></div>
      <div class="stat"><span>最長連続</span><b>${ses.best}</b></div>
      <div class="stat"><span>平均</span><b>${a==null?'–':a.toFixed(2)+'<small>秒</small>'}</b></div>
    </div>
    <p class="sec-t">苦手な音（3回以上出た音のミス率）</p>
    ${rows.length?`<table class="weak"><tbody>${rows.map(x=>`<tr><td>${x.st==='T'?'ト音':'ヘ音'}　<b>${nm(x.n,true)}</b></td>
      <td><span class="bar-mini" style="width:${Math.max(4,Math.round(x.rate*60))}px"></span>${Math.round(x.rate*100)}%ミス（${x.r.s}回）</td></tr>`).join('')}</tbody></table>`
      :'<p class="empty">まだデータがありません。練習を続けると、間違えやすい音がここに並びます。</p>'}
    <p class="sec-t">60秒チャレンジの自己ベスト</p>
    ${bests.length?`<table class="weak"><tbody>${bests.map(([k,v])=>`<tr><td>${bestTxt(k)}</td><td><b>${v}音</b></td></tr>`).join('')}</tbody></table>`
      :'<p class="empty">まだ記録がありません。</p>'}
    <button class="danger${armed?' armed':''}" id="reset">${armed?'もう一度押すと消去します':'すべての記録を消す'}</button>`;
  $('reset').addEventListener('click',()=>{
    if(!armed){armed=true;renderStats();return;}
    armed=false;store.notes={};store.best={};save();renderStats();
  });
}

function openSheet(id){$(id).hidden=false;}
document.querySelectorAll('.scrim').forEach(sc=>{
  sc.addEventListener('click',e=>{if(e.target===sc||e.target.closest('[data-close]')){sc.hidden=true;armed=false;}});
});
$('btnSettings').addEventListener('click',()=>{renderSettings();openSheet('scrimSettings');});
$('btnStats').addEventListener('click',()=>{armed=false;renderStats();openSheet('scrimStats');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.scrim').forEach(s=>s.hidden=true);});

/* ---------- boot ---------- */
buildPool();buildKb();setMode('practice');
if(S.midi)connectMidi();
if(document.fonts&&document.fonts.load){
  Promise.all(['𝄞𝄢','♯♭'].map(t=>document.fonts.load('100px "Noto Music"',t)))
    .then(()=>{gcache={};const f=cur&&cur.fresh;draw();}).catch(()=>{});
}
})();
</script>
